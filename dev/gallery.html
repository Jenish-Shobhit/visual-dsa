<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renderer gallery · Visual DSA (dev)</title>
  <script src="../js/vdsa/core.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/vdsa.css">
  <link rel="stylesheet" href="../css/viz.css">
  <link rel="stylesheet" href="gallery/gallery.css">
</head>
<body>
  <header class="g-top">
    <div class="g-top-inner">
      <div>
        <p class="g-kicker">Visual DSA · developer page</p>
        <h1>Renderer gallery</h1>
        <p class="g-lede">Every view in <code>js/vdsa/views/</code>, driven by a tiny local stepper (not the real player). Each demo renders precomputed snapshots; step backwards to check that motion reverses.</p>
      </div>
      <div class="g-tools" role="group" aria-label="Gallery controls">
        <button type="button" id="g-theme" class="g-btn">Toggle theme</button>
        <label class="g-speed">Speed
          <select id="g-speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <button type="button" id="g-pause-all" class="g-btn">Pause all</button>
      </div>
    </div>
    <nav class="g-nav" id="g-nav" aria-label="Views"></nav>
  </header>

  <main id="gallery" class="g-main"></main>

  <script src="../js/vdsa/views/base.js"></script>
  <script src="../js/vdsa/views/array.js"></script>
  <script src="../js/vdsa/views/tree.js"></script>
  <script src="../js/vdsa/views/graph.js"></script>
  <script src="../js/vdsa/views/grid.js"></script>
  <script src="../js/vdsa/views/list.js"></script>
  <script src="../js/vdsa/views/stack.js"></script>
  <script src="../js/vdsa/views/hash.js"></script>
  <script src="../js/vdsa/views/memory.js"></script>
  <script src="../js/vdsa/views/callstack.js"></script>
  <script src="../js/vdsa/views/chart.js"></script>
  <script src="../js/vdsa/views/flowchart.js"></script>

  <script src="gallery/gallery.js"></script>
  <script src="gallery/demo-array.js"></script>
  <script src="gallery/demo-tree.js"></script>
  <script src="gallery/demo-graph.js"></script>
  <script src="gallery/demo-grid.js"></script>
  <script src="gallery/demo-list.js"></script>
  <script src="gallery/demo-stack.js"></script>
  <script src="gallery/demo-hash.js"></script>
  <script src="gallery/demo-memory.js"></script>
  <script src="gallery/demo-callstack.js"></script>
  <script src="gallery/demo-chart.js"></script>
  <script src="gallery/demo-flowchart.js"></script>
  <script>Gallery.start();</script>
</body>
</html>
