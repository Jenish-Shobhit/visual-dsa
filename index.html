<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7">
<title>Visual DSA · Data structures and algorithms you can watch</title>
<meta name="description" content="A visual course in data structures and algorithms: 38 animated lessons in 7 units, from your first flowchart to max flow and P vs NP. Every figure moves, steps backwards and takes your own input.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/vdsa.css">
<link rel="stylesheet" href="css/viz.css">
<link rel="stylesheet" href="css/home.css">
<script src="js/vdsa/core.js"></script>
<script src="js/curriculum.js" defer></script>
<script src="js/vdsa/shell.js" defer></script>
<script src="js/vdsa/views/base.js" defer></script>
<script src="js/vdsa/views/array.js" defer></script>
<script src="js/vdsa/views/grid.js" defer></script>
<script src="js/vdsa/views/tree.js" defer></script>
<script src="js/vdsa/views/graph.js" defer></script>
<script src="js/vdsa/views/list.js" defer></script>
<script src="js/home.js" defer></script>
</head>
<body data-page="home">
<main id="main" class="home">

  <!-- ============================================================ HERO -->
  <section class="hh" aria-labelledby="hh-title">
    <div class="home-wrap hh__grid">
      <div class="hh__text">
        <h1 class="hh__title" id="hh-title"><span class="hh__line">Watch algorithms</span> <span class="hh__line">work, one step</span> <span class="hh__line">at a time.</span></h1>
        <p class="hh__lede">A visual course in data structures and algorithms, from your first flowchart to max flow and P&nbsp;vs&nbsp;NP. Every figure moves, runs backwards, and takes your own input.</p>
        <div class="hh__cta">
          <a class="btn btn--primary btn--lg hh__start" id="cta-start" href="lessons/01-algorithms.html"><span class="hh__start-label" data-start-label>Start with lesson 1</span></a>
        </div>
      </div>

      <figure class="reel" id="reel" data-unit="u3">
        <div class="reel__bar">
          <p class="reel__chip"><span class="reel__dot" aria-hidden="true"></span><span class="reel__name" data-reel-name>Selection sort</span><span class="reel__from" data-reel-from>Lesson 14</span></p>
          <button type="button" class="reel__toggle" data-reel-toggle aria-pressed="false" aria-label="Pause the animations" title="Pause the animations">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="i-pause"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="i-play"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>
          </button>
        </div>
        <div class="reel__stage" data-reel-stage role="img" aria-label="Animation: bars of different heights are sorted by selection sort; each swap arcs one bar over the other."></div>
        <figcaption class="reel__caption" data-reel-caption>Find the smallest bar, then swap it to the front. Swaps arc, so you can follow both bars.</figcaption>
        <div class="reel__tabs" data-reel-tabs role="group" aria-label="Choose an animation"></div>
      </figure>
    </div>
  </section>

  <!-- ============================================================ UNITS -->
  <section class="hs" id="units" aria-label="The seven units">
    <div class="home-wrap">
      <div class="units" data-units>
        <noscript><p>Lessons are listed in the Contents menu at the top of every lesson page. <a href="lessons/01-algorithms.html">Start with lesson 1</a>.</p></noscript>
      </div>
    </div>
  </section>

  <!-- ============================================================ QUIET LINKS -->
  <nav class="home-wrap hq" aria-label="More to explore">
    <ul class="hq__row hq__row--main">
      <li><a href="studies/index.html">Deep studies</a></li>
      <li><a href="labs/history.html">History</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="hq__row hq__row--labs" id="labs">
      <span class="hq__label">Labs</span>
      <ul class="hq__row" data-labs></ul>
    </div>
  </nav>

</main>
</body>
</html>
